<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Dub Choice</title>
    <meta name="description" content="Redub your favorite scene with your own voice — in the browser." />
    <meta name="theme-color" content="#0b0b0b" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎙️</text></svg>" />
    <script>
      // Только на проде: не засоряем статистику локальной разработкой
      if (location.hostname === "dubchoice.barinbo.im") {
        var gc = document.createElement("script");
        gc.async = true;
        gc.src = "https://stats.barinbo.im:8443/count.js";
        gc.dataset.goatcounter = "https://stats.barinbo.im:8443/count";
        document.head.appendChild(gc);
      }
    </script>
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <button id="logo" class="logo">dub choice</button>
        <div class="lang-switch" role="group" aria-label="Language">
          <button id="lang-ru" class="lang-btn">RU</button>
          <button id="lang-en" class="lang-btn">EN</button>
        </div>
      </header>

      <!-- ЭКРАН 1: выбор пака -->
      <section id="screen-home" class="screen">
        <p class="tagline" data-i18n="tagline"></p>

        <div class="section-label" data-i18n="galleryTitle"></div>
        <div id="preloaded-list" class="preloaded-list"></div>

        <div id="drop-zone" class="drop-zone" tabindex="0">
          <p class="drop-title" data-i18n="dropTitle"></p>
          <p class="drop-hint" data-i18n="dropHint"></p>
          <p class="drop-hint drop-source">
            <span data-i18n="dropMorePacks"></span>
            <a href="https://gamebanana.com/mods/cats/44064" target="_blank" rel="noopener">GameBanana</a>
          </p>
          <div class="drop-buttons">
            <button id="btn-pick-zip" class="btn btn-pill" data-i18n="pickZip"></button>
            <button id="btn-pick-folder" class="btn btn-pill" data-i18n="pickFolder"></button>
          </div>
          <input id="input-zip" type="file" accept=".zip" hidden />
          <input id="input-folder" type="file" webkitdirectory hidden />
        </div>

        <p id="home-error" class="home-error" hidden></p>

        <div id="loaded-label" class="section-label" data-i18n="loadedTitle" hidden></div>
        <div id="pack-list" class="pack-list"></div>

        <footer class="credits">
          <p>
            <span data-i18n="creditsInspired"></span>
            · <a href="https://yeahmaybe.itch.io/the-choicer-voicer" target="_blank" rel="noopener">itch.io</a>
          </p>
          <p>
            <span data-i18n="creditsCreated"></span>
            <a href="https://t.me/barinboimgpt" target="_blank" rel="noopener">@barinboim</a>
          </p>
        </footer>
      </section>

      <!-- ЭКРАН 2: карточка пака -->
      <section id="screen-pack" class="screen" hidden>
        <button id="btn-pack-back" class="btn btn-text" data-i18n="back"></button>
        <div class="pack-card">
          <img id="pack-icon" class="pack-icon" alt="" />
          <div class="pack-meta">
            <h2 id="pack-title"></h2>
            <p id="pack-subtitle" class="pack-subtitle"></p>
            <p id="pack-authors" class="pack-authors"></p>
            <p id="pack-stats" class="pack-stats"></p>
          </div>
        </div>
        <div id="pack-warnings" class="pack-warnings" hidden></div>
        <div class="mix-modes" id="pack-mix-modes">
          <label class="mix-mode">
            <input type="radio" name="mix-mode-pack" value="dub" checked />
            <span class="mix-mode-text">
              <span class="mix-mode-title" data-i18n="mixDub"></span>
              <small data-i18n="mixDubHint"></small>
            </span>
          </label>
          <label class="mix-mode">
            <input type="radio" name="mix-mode-pack" value="voiceover" />
            <span class="mix-mode-text">
              <span class="mix-mode-title" data-i18n="mixVoiceover"></span>
              <small data-i18n="mixVoiceoverHint"></small>
            </span>
          </label>
        </div>
        <p class="mix-modes-note" data-i18n="mixChangeLater"></p>
        <div class="pack-start-row">
          <button id="btn-start" class="btn btn-primary btn-big" data-i18n="start"></button>
          <p id="mic-status" class="mic-status"></p>
        </div>
      </section>

      <!-- ЭКРАН 3: дубляж -->
      <section id="screen-dub" class="screen screen-dub" hidden>
        <div class="dub-top">
          <button id="btn-dub-back" class="btn btn-pill dub-back" data-i18n="back"></button>
          <div class="dub-progress">
            <span id="dub-counter" class="dub-counter"></span>
            <div class="dub-progress-bar"><div id="dub-progress-fill"></div></div>
          </div>
        </div>

        <div class="dub-stage">
          <div class="dub-screen-frame">
            <img id="dub-image" class="dub-image" alt="" hidden />
            <div id="dub-video-slot" class="dub-video-slot" hidden></div>
            <div id="dub-noimage" class="dub-noimage">🎬</div>
            <div id="dub-countdown" class="dub-countdown" hidden></div>
          </div>

          <div class="dub-side">
            <div id="dub-character" class="dub-character"></div>
            <div class="dub-controls">
              <button id="btn-orig" class="btn btn-pill" data-i18n="original"></button>
              <button id="btn-record" class="btn btn-record" data-i18n="record"></button>
              <button id="btn-next" class="btn btn-primary" data-i18n="next" disabled></button>
              <button id="btn-play-take" class="btn btn-pill" data-i18n="myTake" hidden></button>
              <button id="btn-to-final" class="btn btn-pill" data-i18n="toPremiere" hidden></button>
            </div>
            <div class="monitor-block">
              <label class="monitor-toggle">
                <input id="toggle-countdown" type="checkbox" />
                <span>⏰ <span data-i18n="countdownLabel"></span></span>
              </label>
              <label class="monitor-toggle">
                <input id="toggle-monitor" type="checkbox" />
                <span>🎧 <span data-i18n="monitorLabel"></span></span>
              </label>
              <div class="monitor-volume">
                <input id="monitor-volume" type="range" min="0" max="100" value="50" />
                <span id="monitor-volume-value" class="monitor-volume-value">50%</span>
              </div>
            </div>
          </div>
        </div>

        <div id="dub-lang-rows" class="lang-rows">
          <div id="dub-audio-langs" class="lang-row" hidden>
            <span class="lang-row-label" data-i18n="audioTrackLabel"></span>
            <span id="dub-audio-pills" class="lang-pills"></span>
          </div>
          <div id="dub-caption-langs" class="lang-row" hidden>
            <span class="lang-row-label" data-i18n="captionsLabel"></span>
            <span id="dub-caption-pills" class="lang-pills"></span>
          </div>
        </div>
        <p class="caption-edit-hint" data-i18n="captionEditHint"></p>
        <p id="dub-caption" class="dub-caption"></p>
        <div id="dub-caption-edit" class="caption-edit" hidden>
          <textarea id="dub-caption-input" class="caption-input" rows="2"></textarea>
          <button id="btn-caption-done" class="btn btn-pill" data-i18n="captionDone"></button>
        </div>

        <div class="waveform-wrap">
          <canvas id="dub-waveform" class="waveform"></canvas>
          <div id="record-badge" class="record-badge" data-i18n="recBadge" hidden></div>
        </div>
        <p class="waveform-hint" id="waveform-hint"></p>
      </section>

      <!-- ЭКРАН 4: финальный ролик -->
      <section id="screen-final" class="screen screen-final" hidden>
        <button id="btn-final-back" class="btn btn-text" data-i18n="backToClips"></button>
        <h2 class="final-title" data-i18n="premiere"></h2>
        <div class="final-screen-frame">
          <div id="final-video-slot" class="final-video-slot"></div>
          <canvas id="export-canvas" hidden></canvas>
        </div>
        <div class="mix-modes">
          <label class="mix-mode">
            <input type="radio" name="mix-mode" value="dub" checked />
            <span class="mix-mode-text">
              <span class="mix-mode-title" data-i18n="mixDub"></span>
              <small data-i18n="mixDubHint"></small>
            </span>
          </label>
          <label class="mix-mode">
            <input type="radio" name="mix-mode" value="voiceover" />
            <span class="mix-mode-text">
              <span class="mix-mode-title" data-i18n="mixVoiceover"></span>
              <small data-i18n="mixVoiceoverHint"></small>
            </span>
          </label>
        </div>
        <div class="voiceover-volume">
          <span data-i18n="takeVolume"></span>
          <input id="take-volume" type="range" min="0" max="100" value="75" />
          <span id="take-volume-value" class="monitor-volume-value">75%</span>
        </div>
        <div id="voiceover-volume-row" class="voiceover-volume" hidden>
          <span data-i18n="voiceoverVolume"></span>
          <input id="voiceover-volume" type="range" min="0" max="100" value="30" />
          <span id="voiceover-volume-value" class="monitor-volume-value">30%</span>
        </div>
        <div class="final-controls">
          <button id="btn-final-play" class="btn btn-primary btn-big" data-i18n="watch"></button>
          <button id="btn-export" class="btn btn-pill"></button>
          <button id="btn-export-audio" class="btn btn-pill" data-i18n="downloadAudio"></button>
          <button id="btn-retry" class="btn btn-pill" data-i18n="redub"></button>
          <button id="btn-home" class="btn btn-pill" data-i18n="otherPack"></button>
        </div>
        <p id="export-status" class="export-status" hidden></p>

        <!-- Результаты: попадание дубля в оригинальные реплики -->
        <section id="results" class="results" hidden>
          <h3 class="results-title" data-i18n="resultsTitle"></h3>
          <div id="results-track" class="results-track" hidden>
            <p class="results-track-q" data-i18n="scoreTrackQuestion"></p>
            <div id="results-track-pills" class="lang-pills"></div>
          </div>
          <div id="results-total" class="results-total">
            <span id="results-percent" class="results-percent"></span>
            <span id="results-verdict" class="results-verdict"></span>
          </div>
          <p class="results-hint" data-i18n="resultsHint"></p>
          <div id="results-list" class="results-list"></div>
        </section>
      </section>
      <button id="results-jump" class="results-jump" hidden>
        <span data-i18n="resultsJump"></span>
        <span class="results-jump-arrow" aria-hidden="true">↓</span>
      </button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
